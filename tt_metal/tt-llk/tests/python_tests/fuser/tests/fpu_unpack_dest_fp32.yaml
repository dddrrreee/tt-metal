supported_archs: [wormhole]
dest_acc: true
operands:
  - name: input_A
    tile_dims: [[16, 32], [32, 32]]
    dims: [64, 64]
    format: Float32
  - name: output
    tile_dims: [[16, 32], [32, 32]]
    dims: [64, 64]
    format: Float32
operations:
  - math:
      - type: Fpu
        block_tiles: [1, 4]
        in0: input_A
        operation: Datacopy
        unpacker: UnpackerA
        unpack_to_dest: true
        math_fidelity: LoFi
    pack:
      - output: output
        block_tiles: [1, 4]
        packer: Packer
